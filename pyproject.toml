[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-comparator"
version = "1.0.0"
authors = [
  { name="Lukáš Adam", email="lukas.adam.cr@gmail.com" },
]
maintainers = [
  { name="Lukáš Adam", email="lukas.adam.cr@gmail.com" },
]
description = "Library for verification of predictions for wildlife re-identification datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
keywords = [
    "wildlife",
    "re-identification",
    "datasets",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pandas",
    "Pillow",
    "requests",
    "networkx",
    "wildlife-datasets @ git+https://github.com/WildlifeDatasets/wildlife-datasets",
    "animal-re-id @ git+https://github.com/sadda/turtle_re_id",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.0",
]

[project.urls]
"Homepage" = "https://github.com/sadda/image-comparator"
"Documentation" = "https://sadda.github.io/image-comparator/"

[project.scripts]
image-comparator = "image_comparator.main:main"

[tool.setuptools.packages.find]
include = ["image_comparator*"]

[tool.setuptools.package-data]
image_comparator = ["configs/*.json"]

[tool.ruff]
line-length = 250

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]